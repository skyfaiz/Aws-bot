# ── Groww API ──────────────────────────────────────────────────────
api:
  access_token: "${GROWW_ACCESS_TOKEN}"   # injected from environment variable / .env
  base_url: "https://api.groww.in/v1"
  version: "1.0"
  poll_interval_seconds: 5
  max_retries: 3
  retry_backoff_seconds: 2
  stall_warning_seconds: 60

# ── Instrument selection ────────────────────────────────────────────
instrument:
  csv_path: "instrument.csv"
  exchange: "MCX"
  underlying_symbol: "CRUDEOIL"          # not CRUDEOILM (mini)
  segment: "COMMODITY"
  expiry_selection: "nearest"            # nearest | next | specific
  specific_expiry: null                  # YYYY-MM-DD, only for expiry_selection=specific
  min_days_to_expiry: 1                  # skip options expiring within N days (0 = allow expiry day)
  option_type_on_buy: "CE"
  option_type_on_sell: "PE"
  strike_selection: "ATM"                # ATM | 1_OTM | 2_OTM | 1_ITM
  strike_interval: 50
  lots: 1                                # lots wanted per trade; reduced if it would breach risk.max_capital_pct

# ── Candle settings ─────────────────────────────────────────────────
candles:
  interval_minutes: 5
  warmup_candles: 5
  max_window: 500
  persist: true                          # keep candles on disk so restarts / next day stay warm
  max_stale_hours: 72                    # ignore persisted candles older than this

# ── Strategy ────────────────────────────────────────────────────────
strategy:
  name: "halftrend"
  params:
    amplitude: 2
    channel_deviation: 2.0
    atr_period: 100

# ── Risk management ─────────────────────────────────────────────────
risk:
  max_capital_pct: 50.0                  # a trade's value (price x lot size x lots) must stay below this % of equity
  assumed_delta: 0.5                     # used by atr mode to map underlying move -> option move
  stop_loss:
    mode: "fixed_pct"                    # none | fixed_inr | fixed_pct | atr
    value: 7.5
  take_profit:
    mode: "reward_risk"                  # none | fixed_inr | fixed_pct | atr | reward_risk
    value: 2.0

# ── Session (MCX, Mon-Fri) ──────────────────────────────────────────
session:
  timezone: "Asia/Kolkata"
  market_open: "09:15"
  market_close: "23:30"
  auto_squareoff_time: "23:15"
  trade_only_between:
    start: "09:20"
    end: "23:10"

# ── Paper trading ───────────────────────────────────────────────────
paper:
  initial_capital_inr: 100000.0

# ── Historical data recorder (ticks, candles, signals) ──────────────
data:
  enabled: true
  dir: "data"
  retention_days: 30                     # older files are deleted (minimum 7 enforced)

# ── Paths ───────────────────────────────────────────────────────────
paths:
  log_dir: "logs"

# ── Telegram service (telegram_service.py) ──────────────────────────
telegram:
  notify_signals: false                  # message on every candle close with its signal
